# ── 临时：推送代理 Worker 上线验证（一次性，跑完即删）──────────────────────
# 背景：本机网络到 workers.dev / wrangler tail 通道均被阻断（DNS 污染 + SNI），
#   改从 GitHub runner（海外网络，也是 S3-1 接入后的真实调用方）验证与诊断。
#   2026-10-07 部署收尾用；触发：本文件被 push 即跑；删除提交带 [skip ci]。
#   本轮：OPS_WEBHOOK secret 曾被 PowerShell 管道 BOM 污染（Invalid URL → 502），
#   已用无 BOM 输入重传，本 run 为修复后重验。
name: verify-push-proxy
on:
  push:
    paths: ['.github/workflows/verify-push-proxy.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: /healthz 返回 200
        run: |
          code=$(curl -s -o /tmp/hz.json -w '%{http_code}' --max-time 30 "$WORKER_URL/healthz")
          echo "HTTP $code / $(cat /tmp/hz.json)"
          [ "$code" = "200" ] && jq -e '.ok == true' /tmp/hz.json > /dev/null

      - name: 非法 body → 400
        run: |
          code=$(curl -s -o /tmp/bad.json -w '%{http_code}' --max-time 30 \
            -X POST -H 'Content-Type: application/json' --data 'not-json' "$WORKER_URL/push")
          echo "HTTP $code / $(cat /tmp/bad.json)"
          [ "$code" = "400" ]

      - name: 对照 · runner 海外 IP 直连企微
        run: |
          printf '%s' '{"msgtype":"text","text":{"content":"[verify-push-proxy] runner 海外 IP 直连企微：通（对照组，与 Cloudflare 边缘同网络地位）"}}' > /tmp/wecom.json
          resp=$(curl -s --max-time 30 -X POST -H 'Content-Type: application/json' \
            --data @/tmp/wecom.json "$OPS_WEBHOOK" || echo 'CURL_FAILED')
          echo "企微响应: $resp" | tee -a /tmp/diag.txt
          case "$resp" in
            *errcode*0*errmsg*ok*) echo "海外→企微：通" | tee -a /tmp/diag.txt ;;
            CURL_FAILED) echo "repo secret OPS_WEBHOOK 缺失或 curl 失败" | tee -a /tmp/diag.txt ;;
            *) echo "企微拒绝海外 IP 或返回错误：$resp" | tee -a /tmp/diag.txt ;;
          esac

      - name: 真实推送（schedule 路径，走 KV 指纹）
        run: |
          code=$(curl -s -o /tmp/p1.json -w '%{http_code}' --max-time 60 \
            -X POST -H 'Content-Type: application/json' \
            --data @data/reports/post_market_2026-09-30.json "$WORKER_URL/push")
          body=$(cat /tmp/p1.json)
          echo "HTTP $code / $body" | tee -a /tmp/diag.txt
          printf '%s' "{\"msgtype\":\"text\",\"text\":{\"content\":\"[verify-push-proxy] /push → HTTP $code $body\"}}" > /tmp/wecom1.json
          curl -s --max-time 30 -X POST -H 'Content-Type: application/json' \
            --data @/tmp/wecom1.json "$OPS_WEBHOOK" > /dev/null || true
          [ "$code" = "200" ] && jq -e '.pushed == true' /tmp/p1.json > /dev/null

      - name: 同内容重推 → 指纹去重（生产 KV 生效证明）
        run: |
          code=$(curl -s -o /tmp/p2.json -w '%{http_code}' --max-time 60 \
            -X POST -H 'Content-Type: application/json' \
            --data @data/reports/post_market_2026-09-30.json "$WORKER_URL/push")
          body=$(cat /tmp/p2.json)
          echo "HTTP $code / $body" | tee -a /tmp/diag.txt
          printf '%s' "{\"msgtype\":\"text\",\"text\":{\"content\":\"[verify-push-proxy] 重推 → HTTP $code $body\"}}" > /tmp/wecom2.json
          curl -s --max-time 30 -X POST -H 'Content-Type: application/json' \
            --data @/tmp/wecom2.json "$OPS_WEBHOOK" > /dev/null || true
          [ "$code" = "200" ] && jq -e '.pushed == false' /tmp/p2.json > /dev/null
          jq -e '.reason | contains("指纹去重")' /tmp/p2.json > /dev/null

      - name: 诊断结果落盘（本地侧可读）
        if: always()
        run: |
          {
            echo "# verify-push-proxy 诊断快照 $(date -u +%FT%TZ)"
            cat /tmp/diag.txt 2>/dev/null
          } > verify-diag.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify-diag.md
          git commit -m "chore: 验证诊断快照 [skip ci]" || echo "无变更"
          git push

    env:
      WORKER_URL: https://a-sentiment-push.sjc19950404.workers.dev
      OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
