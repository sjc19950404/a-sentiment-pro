# 临时 workflow（推送 10-09 v4 盘中报告后删除）：
#   背景——本机网络 push2/workers.dev 均被墙，OPS_WEBHOOK 只存在 GitHub secret，
#   真实推送唯一通道 = CI。workflow_dispatch 需默认分支注册（临时文件不在 main），
#   故走 push 事件触发：workflow 文件取被推 commit 上的版本，staging 即生效。
#   触发器 = .github/PUSH_1009_TRIGGER 哨兵文件；只做一件事：显式文件推送（无
#   新鲜度检查），不跑管道、不碰生产档、无 git 提交——零副作用。
#   推送前校验（push_ai_report.mjs 内建）会用同拍 v4 快照逐只重验双池规则。
name: push-1009-verify
on:
  push:
    paths:
      - '.github/PUSH_1009_TRIGGER'

concurrency:
  group: push-1009-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 推送 10-09 v4 盘中报告（显式文件，真实企微）
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
        run: node scripts/push_ai_report.mjs data/reports/intraday_2026-10-09_v4.json
