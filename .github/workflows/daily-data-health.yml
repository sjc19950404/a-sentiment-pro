on:
  # 自动调度已迁树莓派(pi_run.sh)，保留手动兜底
  workflow_dispatch:

permissions:
  contents: read
  issues: write               # 鍛婅閫氶亾鐨?issue 鍏滃簳锛坓uard_notify.mjs锛?

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 浠撳簱闆惰繍琛屾椂渚濊禆锛堟棤 package-lock.json锛屽埢鎰忎笉 npm ci锛夛紱闂ㄧ鈶?閭ｇ
      # 涓存椂 jsdom 闇€姹傜敱鍚?workflow 鑷瀹夎锛屾湰 job 涓嶉渶瑕併€?
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 鍓嶅悗绔帴鍙ｅ绾﹀畧鍗紙鏁版嵁妗?vs schemas/锛?
        run: node scripts/check_contract.mjs

      # 鍙緭鍑恒€?*涓嶈闂?*锛?026-10-10 瀹炴祴瀹氱瓥锛屾敼鍓嶅厛璇昏繖娈碉級锛?
      #   CI 鐨勬敹鐩樼敓浜х彮娆℃槸鍖椾含 18:30 / 21:00锛坉aily.yml schedule锛夛紝鏈?job 鎺?16:30
      #   鈥斺€旀棭浜庡綋鏃ョ敓浜с€傛鏃?`freshness.mjs --require-fresh` 浼氱孩鍦ㄣ€岀绾挎ā鍧椾粖鏃?
      #   鏈埛鏂般€嶏紝鏄?*鏃跺簭璇潃**涓嶆槸鐪熸粸鍚庛€傚疄娴嬶細鍛ㄤ竴 16:30 鏃剁偣妯℃嫙蹇呯孩锛坋xit 1锛夛紱
      #   鑰岃妭鍋囨棩锛?0-01锛夋ā鎷熷弽鑰屾槸 exit 0鈥斺€旇剼鏈嚜甯︺€屽亣鏈熷悓鍋滀笉璇潃銆嶏紝鎭版伆鍗拌瘉
      #   绾㈢殑瑙﹀彂鏉′欢鏄?浜ゆ槗鏃ュ綋澶╀笖褰撴棩鐢熶骇灏氭湭璺戝畬"銆?
      #   鐪熸粸鍚庨棬绂佺殑**鍞竴鍑哄**鏄?daily.yml 21:00 鐝閭ｄ釜 step锛堢敓浜т箣鍚庤窇锛屽垽瀹?
      #   鎵嶆垚绔嬶級锛涙湰 job 涓嶉噸澶嶈闂糕€斺€旈噸澶嶅彧浼氬埗閫犳瘡澶╀竴娆＄殑鍥哄畾鍋囩孩锛屾妸鐪熷憡璀︽饭娌°€?
      - name: 鏁版嵁鏂伴矞搴﹀垽瀹氾紙杈撳嚭鍙缁撹锛屼笉璁鹃椄锛?
        run: node scripts/freshness.mjs

      - name: 褰掓。鍒囩墖涓€鑷存€э紙--check 鍙锛?
        run: node scripts/split_archive.mjs --check

      # --out 鐢辫剼鏈嚜琛岃惤鐩橈紙UTF-8 鎭掑畾锛夛紝涓嶉潬 shell 閲嶅畾鍚戯紙缂栫爜闅忓涓昏€屽彉锛?
      #   PS 榛樿 UTF-16 / 閮ㄥ垎鐜 UTF-8 BOM锛岄兘浼氳涓嬫父 JSON.parse 澶辫触锛夈€?
      #   閫€鍑虹爜鍗冲璁＄粨璁衡€斺€旇繚渚嬫椂 job 鐓ф棫绾紙瀹佺孩涓嶅亣锛夈€?
      - name: 璺ㄦ。鍙ｅ緞瀹¤
        id: caliber
        run: node scripts/audit_data_caliber.mjs --json --out data/caliber-latest.json

      # 鍙ｅ緞瀹¤杩濅緥 路 涓撶敤鏂囨锛?026-10-11 淇級锛?
      #   涔嬪墠澶嶇敤 guard_notify锛堝啋鐑熻涔夛級锛屽垽璇嶆槸銆屽畧鍗剼鏈嚜韬紓甯革細鍐掔儫妗ｄ笉鍙
      #   锛堣剼鏈湭璧板埌钀界洏鍗冲穿锛夈€嶁€斺€斿彲瀹¤鑴氭湰鍘嬫牴娌″穿锛屽畠璇氬疄绾㈢殑鏄€宲ain 鍋?9-30
      #   鈮?妗ｆ閿?10-08銆嶏紙鏂緵鏈慨锛夈€傛枃妗堟妸**鏁版嵁杩濅緥**璇存垚**宸ュ叿宕╀簡**锛岀洿鎺ヨ瀵?
      #   鎺掓煡鏂瑰悜銆傛敼璧?notify_caliber_fail.mjs锛氭枃妗堢洿涔﹀摢妗ｃ€佸摢澶┿€佷负浠€涔堣繚渚嬨€?
      - name: 鍙ｅ緞瀹¤杩濅緥鍛婅锛堜紒寰?+ issue 鍏滃簳锛?
        if: steps.caliber.outcome == 'failure'
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/notify_caliber_fail.mjs \
            --file data/caliber-latest.json \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # 鍏朵綑鍋ュ悍妫€鏌ユ楠わ紙濂戠害瀹堝崼/鏂伴矞搴?鍒囩墖涓€鑷存€э級澶辫触 鈫?浠嶈蛋鏃㈡湁 guard_notify銆?
      #   鎺掗櫎 caliber锛氬惁鍒欏彛寰勮繚渚嬩細鍚屾椂鏀跺埌涓ゆ潯锛堜竴鏉″噯纭?+ 涓€鏉?鑴氭湰宕╀簡"锛夈€?
      # 妗ｆ缂轰氦鏄撴棩妫€娴嬶紙2026-10-11 鍔狅級锛?
      #   2026-10-09 鏁存。缂哄け鏄垜缈绘暟鎹椂**鍋剁劧**鍙戠幇鐨勨€斺€旇捣鍥犳槸 10-10 閭ｆ run
      #   cancelled锛岃€?CI 娌℃湁浠讳綍 backfill 璋冨害锛屼簬鏄繖澶╂案涔呯己澶变笖鏃犱汉鐭ユ檽銆?
      #   鍘嗗彶閬楃暀鐨?30 澶╁瓧娈电己鍙ｅ悓灞炴绫汇€傛湰 step 鎶?闈欓粯缂哄け"鍙樻垚**绾㈠嚭鏉?*銆?
      #   鍒ゆ嵁锛氫氦鏄撴棩 = 瑕嗙洊鍖洪棿鍐呭伐浣滄棩 鈭?浼戝競鏃ワ紙calendar 鐨?trading 鏄┖鐨勩€?
      #   days 鍙 closed锛屽繀椤昏嚜宸辩畻锛夛紱**涓婄晫鍙栨槰澶?*鈥斺€斾粖澶╂病閲囦笉绠楃己澶憋紝
      #   鍚﹀垯澶╁ぉ璇姤锛岃鎶ヤ細璁╀汉涔犳儻鎬у拷鐣ュ憡璀︼紝绛変簬娌℃湁鍛婅銆?
      - name: 妗ｆ缂轰氦鏄撴棩妫€娴?
        id: gapdays
        run: node scripts/audit_archive_gaps.mjs --json --out data/gap-days-latest.json

      # 缂哄ぉ涓撶敤鏂囨锛氱洿涔︾己鍝嚑澶?+ 妗ｆ鏈。/鏃ュ巻瑕嗙洊鈥斺€旇繖涓夋牱鎵嶅喅瀹?鏄笉鏄湡缂哄彛"銆?
      #   澶嶇敤 guard_notify 鍙兘寰楀埌銆屾楠ゅけ璐ワ紝鏄庣粏瑙?run 鏃ュ織銆嶏紝璇昏€呰繕寰楃偣杩涘幓缈汇€?
      - name: 缂轰氦鏄撴棩鍛婅锛堜紒寰?+ issue 鍏滃簳锛?
        if: steps.gapdays.outcome == 'failure'
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/notify_gap_days.mjs \
            --file data/gap-days-latest.json \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # 鍏朵綑鍋ュ悍妫€鏌ユ楠わ紙濂戠害瀹堝崼/鏂伴矞搴?鍒囩墖涓€鑷存€э級澶辫触 鈫?浠嶈蛋鏃㈡湁 guard_notify銆?
      #   鎺掗櫎 caliber 涓?gapdays锛氫袱鑰呭悇鏈変笓鐢ㄥ憡璀︼紝鍚﹀垯鍚屼竴闂鏀朵袱鏉′簰鐩告墦鏋剁殑鍛婅銆?
      - name: 瀹堝崼缁撴灉閫氱煡锛堜紒寰?+ issue 鍏滃簳锛?
        if: failure() && steps.caliber.outcome != 'failure' && steps.gapdays.outcome != 'failure'
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --file 鍒绘剰鎸囧悜涓嶅瓨鍦ㄨ矾寰勶細鏈?job 涓嶅仛鍐掔儫锛岃嫢璁╁畠璇讳粨搴撻噷閭ｄ唤鍘嗗彶鐨?
          # data/smoke-latest.json锛坅llOk=true锛夛紝guardVerdict 浼氬垽 ERROR 涓旂悊鐢卞啓鎴?
          # 銆屽啋鐑熸。涓烘垚鍔熸€侊紝涓?step 澶辫触鐭涚浘銆嶏紝issue 鏍囬浼氳瀵煎綊鍥犮€傛樉寮忎紶绌烘。
          # 鈫?smoke=null + outcome=failure锛屼粛鏄?ERROR 绾э紙浼佸井 error + issue 鍏滃簳锛夛紝
          # 璇箟姝ｇ‘锛?鍋ュ悍妫€鏌ユ楠ゅけ璐?锛堥潪鍐掔儫绫诲け璐ワ級銆?
          node scripts/guard_notify.mjs \
            --step-outcome failure \
            --file .github/workflows/no-smoke-report-for-this-job.json \
            --no-smoke \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
