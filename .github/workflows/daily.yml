      #   鑰屾妸 smoke 闂ㄧ锛堟簮鎸傗啋鎷?build 鐨勫叧閿繚鎶わ級涔熸嫋绾€佽繘鑰屽崱浣忔暣鏉℃暟鎹绾匡紱
      #   鑻ユ湰姝ュけ璐ワ紝涓嬩竴杞?smoke 浼氶噸鎻愪氦鑷剤锛屼粎鐭殏涓㈠け涓€娆℃柊椴滃害锛屼笉褰卞搷瀹炴椂鐩戞帶銆?
      #   鍐呭鏈彉锛坓it diff --cached 绌猴級鍒欒烦杩囨彁浜わ紝閬垮厤绌烘彁浜ゆ棤璋撹Е鍙?Pages 閮ㄧ讲銆?
      - name: 鎻愪氦鍐掔儫妗ｏ紙data/smoke-latest.json 钀藉簱锛屽埛鏂版柊椴滃害锛?
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/smoke-latest.json
          if git diff --cached --quiet; then
            echo "鍐掔儫妗ｅ唴瀹规湭鍙橈紝璺宠繃鎻愪氦"
          else
            git commit -m "chore: 鍐掔儫妗?$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            retry=0
            until git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push; do
              retry=$((retry+1))
              if [ "$retry" -ge 3 ]; then echo "push 杩炵画 3 娆¤鎷掞紙骞跺彂绔炴€佹湭瑙ｏ級锛屾斁寮?; exit 1; fi
              echo "push 琚嫆锛堝悓杞?job 骞跺彂绔炴€侊級锛岄噸璇?$retry/3 ..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
      # 鈶?涓ゅ競鎴愪氦棰濊法婧愬璐︼紙2026-10-08 瀵硅处浠诲姟锛夛細smoke 涔嬪悗 build 涔嬪墠鐨勭嫭绔?
      #   瑙傛祴鈥斺€斾笢璐?push2his 澶囨簮锛堜笂璇?娣辫瘉涓?secid 鐩稿姞锛夋牳楠屼富婧愶紙s6 椤轰骇钀界洏
      #   鐨?amountAnchor锛夊綋鏃ュ€硷紝宸€艰秴 5% 鎴栧婧愪笉鍙敤 鈫?浼佸井+issue 鍙岄€氶亾鍛婅銆?
      #   绾娴嬩笉鎷?build锛氭亽 exit 0锛? continue-on-error 鍙屼繚闄╋級锛孋I 绾㈠彧灞炰簬瀹堝崼锛?
      #   涓绘簮鍊肩己澶憋紙s6 纭け璐ワ級鑷姩璺宠繃鈥斺€斿畧鍗厛璇磋瘽锛屽璐︿笉閲嶅鍛婅銆?
      - name: 璺ㄦ簮瀵硅处锛堜袱甯傛垚浜ら锛屽樊鍊艰秴闃堝€煎缓 issue锛屼笉鎷?build锛?
        if: always()
        continue-on-error: true
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/cross_check.mjs \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # 鈶?鈶?瀹堝崼缁撴灉鍙岄€氶亾閫氱煡锛?026-10-08 鍚堝苟浜や粯锛夛細PASS/BLOCK/ERROR 涓夋€佸叏瑕嗙洊锛?
      #   浼佸井 + GitHub issue 鍙岄€氶亾銆傛浛浠?alert_smoke_fail.mjs 鍗曢€氶亾鏃朵唬锛堝叾浼佸井姝ｆ枃
      #   鐢?smokeFailEvent 缁х画 carry锛岃涔夐浂婕傜Щ锛涢伩鍏?BLOCK 鏃跺弻浼佸井鎵撴壈锛夈€?
      #   路 if: always()鈥斺€斿啋鐑?step 鏃犺鎴愯触锛堝惈瓒呮椂 kill锛夐€氱煡蹇呭彂锛氶€氱煡鍣ㄧ嫭绔嬩簬
      #     瀹堝崼杩涚▼锛岃 outcome + 钀界洏鎶ュ憡浜ゅ弶鍒ゅ畾锛岃剼鏈穿鎺変篃鏈?issue 鍏滃簳锛堣繖鏄?
      #     閫氱煡鍑芥暟鏀惧畧鍗剼鏈唴閮ㄥ仛涓嶅埌鐨勶級锛?
      #   路 continue-on-error: true鈥斺€旈€氱煡鑷韩澶辫触锛坵ebhook 鏈厤/issue API 鎷掔粷锛夌粷涓?
