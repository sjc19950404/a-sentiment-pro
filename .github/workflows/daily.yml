            exit 1
          fi
          echo "鉁?閲嶈瘯閫氳繃鈥斺€旂涓€娆″け璐ヤ负鐬椂鎶栧姩鑷剤锛岄潪婧愭晠闅?
      - name: 鍐掔儫鎶ュ憡钀界洏鐣欐。锛坉ata/smoke-latest.json锛岄殢浠撳簱鍙锛?
        if: always()
        run: |
          if [ -f data/smoke-latest.json ]; then
            echo "鍐掔儫鎽樿锛?
            node -e "const r=require('./data/smoke-latest.json'); console.log(r.allOk?'鍏ㄩ儴閫氳繃':'纭け璐? '+r.hardFail.join(','), '@', r.tradeDateAnchored)"
          fi
      # 鈽?2026-10-19 淇锛堟柟妗圓锛夛細鍐掔儫妗ｅ啓鍏ュ悗鐢辨湰 smoke job 鑷鎻愪氦钀藉簱銆?
      #   鏍瑰洜锛氭鍓?smoke 鍙啓涓嶆彁浜わ紝build 铏藉湪 git add 娓呭崟鍒椾簡 smoke-latest.json
      #   鍗翠粠涓嶉噸鏂扮敓鎴愬畠 鈫?浠撳簱鍓湰鍐荤粨鍦?2026-10-08锛屽績璺冲摠鍏佃鎶?鍐掔儫妗ｉ檲鏃?銆?
      #   鐜版敼涓?smoke 鍐欏畬鍗虫彁浜わ紙娌跨敤 build 鐨?pull --rebase -X theirs + 閲嶈瘯绔炴€佸姞鍥猴級锛?
