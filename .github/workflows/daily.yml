  build:
    # 鐩樺悗瀹屾暣绠￠亾锛?8:30 / 21:00 / 鎵嬪姩瑙﹀彂锛夆€斺€?蹇呴』鍏堣繃鍐掔儫闂ㄧ锛堟簮鎸備簡涓嶅啓鐢熶骇妗ｏ級
