      #     路 閲嶈瘯浠嶈触 = 鐪熷疄婧愭晠闅?鈫?exit 1 鐓ф棫鎷?build锛堢湡鎸傜殑婧愯繛鎸備袱娆＄収鏍风孩锛?
      #       涓嶄細鍥犻噸璇曡鏀捐繃锛夈€?
      #   瑕嗙洊鎵€鏈夌彮娆¤€岄潪浠呭噷鏅細18:30/21:00 鐨勫啋鐑熷け璐ュ悓鏍蜂細璇嫤涓昏窇锛岄噸璇曡鐬椂
      #   鎶栧姩涓嶅啀鎵撴柇鏁版嵁绠＄嚎锛堜唬浠蜂粎 +2 鍒嗛挓锛岃繙浣庝簬鏁寸彮 build 琚嫤鐨勬崯澶憋級銆?
      #   閲嶈窇浼氳鐩?data/smoke-latest.json 涓烘渶缁堟€侊紙棣栬触璇佹嵁鍦ㄦ棩蹇楅噷鍙锛夈€?
      - name: 鍏簮鐪熷疄 API 鍐掔儫锛堜笉 mock锛屾柇瑷€ 200+闈炵┖+瀛楁濂戠害锛涚灛鏃舵姈鍔ㄩ噸璇曚竴娆★級
        id: smoke
