name: daily-sentiment

on:
  schedule:
    - cron: '30 10 * * *'     # 北京 18:30（UTC 10:30），每天（含周末，触发非交易日回补）；盘后首抓（部分源可能未出当日数据）
    - cron: '0 13 * * 1-5'    # 北京 21:00（UTC 13:00），晚间补抓：深证日K/龙虎榜等延迟数据齐后重抓当日并覆盖，合并时同日替换 + 全档重算
    # ★ 美股收盘档（2026-10-01 事故修复）：北京次日 04:30 = 美东 16:30（收盘 + 30 分钟结算缓冲）。
    #   为什么必须单独一条：上面 21:00 那次跑在北京 21:00 = 美东 09:00，**美股还没开盘**
    #   （09:30 开），数据源给的是盘前占位（last==prevClose、open/high/low=0）。
    #   旧代码把它当"当日收平 0%"渲染，用户读成"外围没动"——而真相是"这一场还没开"。
    #   修法是两层：① 行情层未成交一律 null（硬防线，与时刻无关，见 src/global.js）；
    #   ② 时刻层把美股收盘态那一份快照**单独抓好**，这就是本 cron。
    #   UTC 20:30 = 北京 04:30（次日）。周一至五 UTC 20:30 对应美股周一至五收盘。
    #   为什么取 20:30（16:30 ET）而不是 20:00（16:00 ET）：收盘瞬间数据源仍在回填，
    #   留 30 分钟让结算价稳定，避免抓到"半成品收盘价"。
    - cron: '30 20 * * 1-5'
    # A50 夜盘收盘档（2026-10-13 拍板）：北京 05:20（UTC 21:20）= SGX 夜盘 05:15 收盘后。
    #   仅此档抓取把 A50 当"夜盘收盘"用；其余时刻 src/global.js 标 night-open、报告显「夜盘未收」。
    - cron: '20 21 * * 1-5'
    # 盘中轻量快照：北京 09:30~15:00 每 30 分钟（UTC 01:30~07:00 的 :00/:30）。
    # 与上面几个 cron 的**根本区别**：这条只跑 scripts/snapshot_intraday.mjs，
    # 不跑管道、不碰 archive.json、不重算分位与因子（理由见该脚本文件头）。
    # 覆盖 01:00~07:30 UTC（= 北京 09:00~15:30），脚本内部再按相位闸门过滤出真正的盘中时段。
    - cron: '0,30 1-7 * * 1-5'
    # ② 盘前数据源冒烟（北京 08:30 = UTC 00:30）：六源真打一遍。
    #   开市前摸门的意义：源悄悄改字段/加风控，盘前就能红出来，带 needs 依赖拦下
    #   盘后主跑——坏数据不进生产档。这条 cron **只触发 smoke job**（build 的 if 已排除）。
    - cron: '30 0 * * 1-5'
    # ③ 任务一 · 盘前观察清单（2026-10-09 拆分）：北京 09:00（UTC 01:00）——用户指定。
    #   数据源物理隔离：只读昨收口径档（pain 连板梯队 + global 外围），不碰 intraday
    #   实时源；输出「今日观察清单」（不含操作建议），与任务二的候选池语义彻底分野。
    #   非交易日由脚本内闸门自动跳过（exit 0 不红）。⚠ 与 09:00 tick 首拍同刻——
    #   不同 cron 字符串 = 独立 run，job 级 if 路由互不掺和（concurrency 组内串行）。
    #   ⚠ GitHub 定时可能延迟数分钟（平台已知行为）：昨收口径数据不随竞价变化，
    #     延迟不损内容正确性；推送有指纹去重兜底不重复。
    - cron: '0 1 * * 1-5'
    # ④ 任务二 · 盘中候选池（2026-10-09 拆分）：北京 09:35 / 10:30 / 14:00 三时点
    #   各触发一次（分-时耦合无法写成一条，三条独立 cron）。
    #   每次触发：先抓新快照（腾讯行情补量比/PE/PB + 东财主力净流入）→ 全量重算
    #   候选池（涨幅 3-7% · 量比>2 · 未涨停 · 主力净流入为正，按综合得分 Top 10）
    #   ——不沿用上一轮结果；数据源与任务一物理隔离（只认 intraday 当日快照，
    #   缺席则空池报因，绝不回落昨收口径）。
    #   tick 网格（:00/:30）此后回归**纯快照职责**：只抓数据不出报告（报告层
    #   与数据层解耦，三时点报告读的就是最近一拍快照——9:35 报告用本 cron 自抓的新拍）。
    #   旧 S3-6 决策时点 cron（'15 2' / '45 5,6'）随之退役（推送判断被三时点取代）。
    #   ⚠ smoke/build 是排除式 if——cron 字符串变更必须同步（见各自 if），否则误跑。
    - cron: '35 1 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:        # 手动触发

# ── 模拟选股层总开关（S2 · 2026-10-07 用户拍板）────────────────────────────
# 默认 'true'；GitHub 仓库 Settings → Secrets and variables → Actions → Variables
# 里设 SIMULATION_MODE=false 即全局关闭（盘前/盘中/盘后/周报四挂点一起），
# 不用动本文件——回测期间临时关闭、复测完改回，零 workflow 改动。
# 单次强制开：手动 dispatch 命令里加 --sim（CLI flag 优先于 env）。
env:
  SIMULATION_MODE: ${{ vars.SIMULATION_MODE || 'true' }}

# 调度重叠治理（2026-10-06 部署治理配套）：18:30 首抓若未跑完（六源慢/重试），21:00 补抓
# 会在旁并行——两条管线同时写 data/ 再各自 git 提交是竞态。数据写入不可中断，故**排队不取消**
# （cancel-in-progress: false）：后到者等先到者收尾再跑。盘中快照（30 分钟一拍）同受此治理。
concurrency:
  group: daily-sentiment
  cancel-in-progress: false

permissions:
  contents: write
  # issues: write（2026-10-08 守卫双通道 ③）：守卫 BLOCK/ERROR 时 guard_notify 建
  # 兜底 issue（GITHUB_TOKEN 由 CI 自动注入，零新增 secret）。issue 是企微通道挂掉
  # （secrets 失效/网络墙）时的最后触达面——本工作流三班 smoke，异常静默一天的
  # 代价远大于一次 API 调用。
  issues: write
  # pages/id-token 权限已移除（2026-10-06 部署治理）：Pages 部署收口至 deploy-pages.yml
  # 单通道——本工作流回归纯数据生产，部署由 deploy-pages.yml 监听本工作流完成（workflow_run）触发
  # （bot 的 GITHUB_TOKEN push 不会触发 on:push，故不能靠 paths(data/**) 自动部署，详见 deploy-pages.yml ③）。

jobs:
  # ── ② 真实 API 冒烟：六源逐个真打（getharden/东财LHB/同花顺行业/腾讯指数/东财池/同花顺日K）──
  #   为什么排在 build 之前且 build needs 它：管道容灾会「保留上次快照并标失败」，
  #   源结构悄悄变化时页面只表现为数据慢慢变旧——等发现已晚。冒烟每天主动摸一遍
  #   每个源的门：硬失败 → 本 job 红 → build 被拦（不污染生产档）+ CI 邮件当天报警。
  #   软失败（龙虎榜当日未公布）不算源故障（盘后早跑正常态）。
  smoke:
    # 任务一/任务二触发时点（'0 1' 盘前 / '35 1'/'30 2'/'0 6' 盘中三时点）已加排除
    # ——冒烟是盘前 08:30 摸门语义，任务时点重跑纯浪费且占 daily-sentiment 并发槽。
    if: github.event.schedule != '0,30 1-7 * * 1-5' && github.event.schedule != '0 1 * * 1-5' && github.event.schedule != '35 1 * * 1-5' && github.event.schedule != '30 2 * * 1-5' && github.event.schedule != '0 6 * * 1-5'
    runs-on: ubuntu-latest
    # 5 → 8：重试兜底后最坏路径 = 首跑（≤2 分钟）+ 60s 退避 + 重跑，留足余量不误触超时。
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ── 瞬时抖动重试（2026-10-07）────────────────────────────────────────────
      #   实录：北京 10-07 04:41 那班冒烟因 UND_ERR_SOCKET 型网络抖动 53s 失败 →
      #   半夜报警邮件；同 commit 一小时后复跑 6/6 全绿（自愈）。dns ipv4first 只能
      #   降频不能绝根，故 step 层兜底：失败 → 退避 60s 重跑一次。
      #     · 重试通过 = 抖动自愈 → job 绿，夜间误报清零；
      #     · 重试仍败 = 真实源故障 → exit 1 照旧拦 build（真挂的源连挂两次照样红，
      #       不会因重试被放过）。
      #   覆盖所有班次而非仅凌晨：18:30/21:00 的冒烟失败同样会误拦主跑，重试让瞬时
      #   抖动不再打断数据管线（代价仅 +2 分钟，远低于整班 build 被拦的损失）。
      #   重跑会覆盖 data/smoke-latest.json 为最终态（首败证据在日志里可见）。
      - name: 六源真实 API 冒烟（不 mock，断言 200+非空+字段契约；瞬时抖动重试一次）
        id: smoke
        run: |
          if node scripts/smoke_sources.mjs; then exit 0; fi
          echo "⚠ 第一次冒烟失败——疑似瞬时网络抖动，退避 60 秒后重试一次"
          sleep 60
          if ! node scripts/smoke_sources.mjs; then
            echo "✗ 重试后仍失败——判定为真实源故障，硬失败照旧拦下主跑"
            exit 1
          fi
          echo "✓ 重试通过——第一次失败为瞬时抖动自愈，非源故障"
      - name: 冒烟报告落盘留档（data/smoke-latest.json，随仓库可见）
        if: always()
        run: |
          if [ -f data/smoke-latest.json ]; then
            echo "冒烟摘要："
            node -e "const r=require('./data/smoke-latest.json'); console.log(r.allOk?'全部通过':'硬失败: '+r.hardFail.join(','), '@', r.tradeDateAnchored)"
          fi
      # ★ 2026-10-19 修复（方案A）：冒烟档写入后由本 smoke job 自行提交落库。
      #   根因：此前 smoke 只写不提交，build 虽在 git add 清单列了 smoke-latest.json
      #   却从不重新生成它 → 仓库副本冻结在 2026-10-08，心跳哨兵误报"冒烟档陈旧"。
      #   现改为 smoke 写完即提交（沿用 build 的 pull --rebase -X theirs + 重试竞态加固），
      #   每日盘前(08:30)及每次 smoke 跑批后 generatedAt 即前进，哨兵判新鲜。
      #   continue-on-error: true——提交是"证据落库"的次要动作，绝不能因 push 竞态偶败
      #   而把 smoke 门禁（源挂→拦 build 的关键保护）也拖红、进而卡住整条数据管线；
      #   若本步失败，下一轮 smoke 会重提交自愈，仅短暂丢失一次新鲜度，不影响实时监控。
      #   内容未变（git diff --cached 空）则跳过提交，避免空提交无谓触发 Pages 部署。
      - name: 提交冒烟档（data/smoke-latest.json 落库，刷新新鲜度）
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/smoke-latest.json
          if git diff --cached --quiet; then
            echo "冒烟档内容未变，跳过提交"
          else
            git commit -m "chore: 冒烟档 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            retry=0
            until git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push; do
              retry=$((retry+1))
              if [ "$retry" -ge 3 ]; then echo "push 连续 3 次被拒（并发竞态未解），放弃"; exit 1; fi
              echo "push 被拒（同轮 job 并发竞态），重试 $retry/3 ..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
      # ⑤ 两市成交额跨源对账（2026-10-08 对账任务）：smoke 之后 build 之前的独立
      #   观测——东财 push2his 备源（上证+深证两 secid 相加）核验主源（s6 顺产落盘
      #   的 amountAnchor）当日值，差值超 5% 或备源不可用 → 企微+issue 双通道告警。
      #   纯观测不拦 build：恒 exit 0（+ continue-on-error 双保险），CI 红只属于守卫；
      #   主源值缺失（s6 硬失败）自动跳过——守卫先说话，对账不重复告警。
      - name: 跨源对账（两市成交额，差值超阈值建 issue，不拦 build）
        if: always()
        continue-on-error: true
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/cross_check.mjs \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # ②+③ 守卫结果双通道通知（2026-10-08 合并交付）：PASS/BLOCK/ERROR 三态全覆盖，
      #   企微 + GitHub issue 双通道。替代 alert_smoke_fail.mjs 单通道时代（其企微正文
      #   由 smokeFailEvent 继续 carry，语义零漂移；避免 BLOCK 时双企微打扰）。
      #   · if: always()——冒烟 step 无论成败（含超时 kill）通知必发：通知器独立于
      #     守卫进程，读 outcome + 落盘报告交叉判定，脚本崩掉也有 issue 兜底（这是
      #     通知函数放守卫脚本内部做不到的）；
      #   · continue-on-error: true——通知自身失败（webhook 未配/issue API 拒绝）绝不
      #     把 CI 再拖红，红只留给「守卫本身没过」；
      #   · PASS 只发企微心跳（首跑盯防刚需，嫌吵 GUARD_PASS_NOTIFY=false 关）；issue
      #     只兜 BLOCK/ERROR——smoke 每天三班，PASS 流水 issue 会淹没真异常台账；
      #   · issue 用 GITHUB_TOKEN（自动注入）+ 顶层 issues: write 权限，零新增 secret。
      - name: 守卫结果双通道通知（PASS 心跳 / BLOCK+ERROR 企微+issue 兜底）
        if: always()
        continue-on-error: true
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/guard_notify.mjs \
            --step-outcome "${{ steps.smoke.outcome }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  build:
    # 盘后完整管道（18:30 / 21:00 / 手动触发）—— 必须先过冒烟门禁（源挂了不写生产档）
    needs: smoke
    if: >
      needs.smoke.result == 'success' &&
      github.event.schedule != '0,30 1-7 * * 1-5' &&
      github.event.schedule != '30 20 * * 1-5' &&
      github.event.schedule != '30 0 * * 1-5' &&
      github.event.schedule != '0 1 * * 1-5' &&
      github.event.schedule != '35 1 * * 1-5' &&
      github.event.schedule != '30 2 * * 1-5' &&
      github.event.schedule != '0 6 * * 1-5' &&
      github.event.schedule != '20 21 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 交易日历：从**上证指数日K**反推真实开市日（休市 = 工作日内无日K）。
      # ⚠ 必须排在管道**之前**：管道用日历判"今天是不是交易日"，
      #   日历若还是上次的（比如跨年、或长假前更新过而节后没续），
      #   会在开市日误判为休市 → 整天不抓数据，且页面上只表现为"没更新"，极难归因。
      #   （本项由 scripts/audit_lhb_caliber.mjs 的 B13 块按「run: 行先后」机器校验。）
      - name: 同步交易日历（指数日K反推，含调休补班）
        run: node scripts/fetch_calendar.mjs
      # ── 2026-10-14 pain 断供根因修复：pain 之前预跑一遍管道，把"当日"并入 archive ──
      #   根因：archive 的"今天"只由 pipeline 的 mergeNewDays 产生，而 fetch_pain 排在
      #   pipeline 之前 → pain 跑时 archive 尚无今天 → fetch_pain 的"运行日不在交易日
      #   序列"闸门（fetch_pain.mjs:74-76，拿 archive all_days 当序列）误拒 → CI 上 pain
      #   结构性每天断供（闸门 2026-10-11 加上后一直如此，signals.pain 长期 null）。
      #   修法：在 pain 之前插一道 early pipeline（MODE=live），靠 mergeNewDays 把当日并入
      #   archive；随后 fetch_pain 闸门自然放行、算出当日真值。末尾原有 pipeline 再把新鲜
      #   pain/breadth/crosscheck/llm 嵌入 signals-latest.json。
      #   本地实证：archive 含当日后，fetch_pain 无 --date 即放行并出当日值（多空拉锯）。
      #   代价：多跑一遍管道（当日抓取有缓存，约 +1~2 分钟）；mergeNewDays 同日 replace 幂等。
      #   B13⑧ 审计安全：其只校验"第一个 pipeline.run 在 calendar.run 之后"，early 管道
      #   正排在 calendar 之后，iCal < iPipe 仍成立。
      - name: 预跑管道（当日入档，供 pain/breadth 取当天；末尾正式管道再嵌入新鲜 signals）
        env:
          MODE: live
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
        run: node src/pipeline.js
      # ── 2026-10-13 时序修复：宽度/亏钱效应抓取提前到切片生成之前 ──
      #   原顺序 pipeline.js(切片含 signals-latest.json) 跑在 fetch_breadth/fetch_pain 之前，
      #   切片只能吃上一轮的宽度/亏钱效应 → 前端宽度背离/亏钱效应长期"未评估"。
      #   现两者提前到管道之前，切片即吃到当日最新宽度与亏钱效应。
      - name: 抓取亏钱效应行情（昨涨停今日表现，收盘后口径）
        run: node scripts/fetch_pain.mjs
        continue-on-error: true
      - name: 抓取多维市场宽度（分片扫描全市场日K）
        run: node scripts/fetch_breadth.mjs --shards 8
        continue-on-error: true
      - name: 运行管道（live 模式，非交易日自动跳过）
        env:
          MODE: live
          # 运维告警推送通道（降维预埋）：拦截器事件 → 企微机器人。
          # secret 未配置时为空串 → 脚本内部跳过推送（仅落盘），不会报错。
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
        run: node src/pipeline.js
      - name: 数据新鲜度判定（按交易日历，输出可读结论）
        run: node scripts/freshness.mjs
      # 外围行情独立成步：A 股休市（长假）时上面那步会整段跳过，而假期恰恰是外围数据
      # 最该攒的时候——节后预案靠的就是这几天美股交易日。所以它不受 A 股开市与否影响。
      # 抓不到时脚本内部容灾（保留上次快照并标记失败），不会拖挂整条 job。
      - name: 抓取外围市场行情（隔夜美股/中国资产/汇率/商品）
        run: node scripts/fetch_global.mjs
      - name: 生成 V5.2 回测档（成本/平滑/风控/网格帕累托/滚动/主线选股）
        run: node scripts/backtest.mjs
      # ⑥ 双轨账本重放（2026-10-08 第三批接入 CI）：三轨道每日纪面账（A 执行/B 参考/C 影子）。
      #   之前只在本地手动跑——CI 断供时旧值顶替当日值（第二批 09-30 名/10-08 内容事故的
      #   供应侧根源）。紧贴 backtest.mjs：账本三重门禁要读 data/backtest.json::v52。
      #   continue-on-error：重放挂（如数据延伸导致锚点漂移）只影响披露不影响核心数据面，
      #   不阻断 CI；真滞后由末尾 freshness --require-fresh 三模块门禁标红（通知语义，
      #   数据在前一步已提交不丢），消费端守卫（②）同步把旧值拦在叙事之外。
      - name: 双轨账本重放（A执行/B参考/C影子，滞后不阻断）
        run: node tools/backtest/paper_dual_track.mjs
        continue-on-error: true
      # ③ 策略收益回测：冰点反转/题材动量/梯队风险偏好 × 沪深300基准（严格 point-in-time）。
      #   个股日K走 data/.bt_kline/ 缓存（不入库，CI 每次真抓——86 只 top1 题材成员约 2 分钟）。
      #   产物 data/backtest-strategies.json 入库；样本不足时脚本自行跳过不阻断。
      - name: 生成策略收益回测（三策略 × 基准，point-in-time）
        run: node scripts/backtest_strategies.mjs
        continue-on-error: true
      # 公式版本回归验证集：v4.5 / v5.0 / v5.2 在同一段历史上并行重算，
      # 对次日上证涨跌幅算相关性 + 方向准确率。改公式后跑一次即可看出影响面，
      # 不必再用肉眼看"某天数字好像不对"。
      # 样本不足时脚本自行跳过（不阻断），产物自带"样本量小、不排优劣"的披露。
      - name: 公式版本回归验证（v4.5/v5.0/v5.2 并行重算对比）
        run: node scripts/version_regression.mjs
      # 模拟交易的标的池：从存档里归纳出「有哪些票、属于哪个板段、最近一次真实收盘价」。
      # 必须在 archive.json 更新之后跑——池子就是存档的派生物，早跑会拿到昨天的价。
      # 脚本内部对板段非法/非股票品种做校验，不合法直接退出，避免把错池子推上线。
      - name: 构建模拟交易标的池（板段/ST/最近真实收盘价）
        run: node scripts/fetch_universe.mjs
      # ★ 2026-10-12 修复：管道落盘后 archive.json 仍带回写字段 lhb_aggr（sources.js 抓数赋值所致），
      #   龙虎榜口径守卫会因此判红。recalc 在所有写档步骤之后、守卫之前清掉 lhb_aggr 并全档重算因子，
      #   确保守卫读到的是清洗后的主档。recalc 不改天数/回填标记，不影响回测对账（backtest.json 同源）。
      - name: Recalc LHB daily
        run: node scripts/recalc_lhb_daily.mjs
      # 口径守卫：两套龙虎榜净额（当日榜 / 含区间累计榜的全量）不得混用。
      # 放在提交之前——口径一旦漂移，宁可本次运行失败，也不要把错数据推上线。
      - name: 龙虎榜口径守卫（双口径不混用 + 存档可重现）
        run: node scripts/audit_lhb_caliber.mjs
      # 行业离群告警跨源自动核验：扫全档 OUTLIER_INDUSTRY（warn），逐条去同花顺行业指数
      # 拉该日历史日K 独立复算 → 一致即自动销案（写入 data/industry_outlier_review.json，
      # 此后不再重复报）；不一致标 data-error（**不销案**）并 exit 1。
      # 只影响是否重复告警，不动任何数值。失败不阻断数据管线（continue-on-error），
      # 但日志 ✗ 与台账 diff 都会留痕——异常排查见 data-error 条目。
      - name: 行业离群告警跨源自动核验（真实销案 / 异常报警）
        run: node scripts/verify_industry_outliers.mjs
        continue-on-error: true
      - name: 单元测试（含 Python↔JS 一致性夹具比对 + 合并版 UI schema 守卫）
        run: node --test --test-reporter=spec
      # 前后端接口契约门禁（V5.3 同步机制）：全部数据档落盘后校验 vs schemas/ 契约。
      #   放在提交与 UI 构建之前——字段漏产/改名/类型漂移宁可整次运行失败，
      #   也不让「前端静默渲染空白」的档推上线（missingNote→missingReason 事故的常驻拦截器）。
      #   契约本体与变更流程见 schemas/*.schema.json 头注与 README「接口契约」章节。
      - name: 前后端接口契约守卫（数据档 vs schemas/ 契约）
        run: node scripts/check_contract.mjs
      # ── 2026-10-13 接入跨源互证（fetch_crosscheck，此前从未接入 CI → 面板冻结在 9-30）──
      #   读档案主源(同花顺行业)+抓第二源(腾讯/申万二级)比对，产出 data/crosscheck-latest.json。
      #   需 pipeline 之后的新鲜档案；continue-on-error 不阻断主链路（第二源限流时静默跳过）。
      - name: 跨源一致性互证（行业双源比对，解决跨源互证面板陈旧）
        continue-on-error: true
        run: node scripts/fetch_crosscheck.mjs
      # ── LLM 舆情试点：2026-10-17 用户指令暂停（太贵且无效）──────────────────
      #   代码保留归档（scripts/fetch_llm_sentiment.mjs / src/llm_sentiment.js），以后再说。
      #   if: false 关停定时任务；重启用时去掉 if:false 并翻转 daily_report.js 的
      #   ENABLE_LLM_SECTION 开关即可。
      - name: 生成 LLM 舆情参考（已暂停 2026-10-17：试点停更，代码保留归档）
        if: false
        continue-on-error: true
        env:
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node scripts/fetch_llm_sentiment.mjs
      # ── 合并版（merge/pro-into-ui · 2026-10-02）：K线增量 + UI 构建 + Pages 部署 ──
      # K线增量必须在 UI 构建**之前**：个股 closes/yzt_chg（昨涨停今均涨幅）由 K 线分片派生，
      # 分片没当日 bar → 这些卡片按缺失降级（如实「—」，不编数）。非交易日脚本自报无增量。
      - name: K线分片增量（全市场当日 bar，非交易日无增量）
        run: node ui/fetch_kline_all.mjs
      - name: 合并构建 UI（PRO 管线数据层 + 原系统 UI 展示层 → dist/）
        run: node scripts/build_ui.mjs
      # ── AI 报告（S2 · 归档轨挂 build 末尾，设计文档 §3.3）───────────────────
      # 盘后 + 周报：18:30 首抓与 21:00 补抓都生成（补抓数据更全时覆盖同日文件）。
      # 周报自带闸门：tradeDate 非本周最后交易日（周五或节前最后一天）自动跳过。
      # 模拟选股段由顶层 env SIMULATION_MODE 控制（默认开，仓库 Variables 可关）。
      - name: 生成盘后 AI 报告（含模拟选股段）
        run: node scripts/build_ai_report.mjs --type post_market
      - name: 生成周报 AI 报告（非本周最后交易日自动跳过）
        run: node scripts/build_ai_report.mjs --type weekly
      # 推送只在 21:00 补抓与手动触发：18:30 首抓常缺龙虎榜/深证日K，推半成品
      # 不如等 2.5 小时推全量（"收盘 5 分钟"语义由页面即时轨 15:05 版补位，
      # 双轨时点约束见设计文档 §3.3）。指纹去重保证 21:00 与 18:30 内容未变时不重推。
      # ── 盘后汇总推送（2026-10-12 用户指令）：按 盘前→盘中→盘后 顺序把当日三份补推企微 ──
      #   为什么用显式文件而非 --latest：盘前(09:00)/盘中(14:00) 生成距盘后 21:00 已超
      #   15 分钟新鲜度窗口，--latest 会被窗口挡掉；显式文件推送不走窗口检查，正好补推。
      #   盘前报告若当日未生成（如 premarket job 未入库）→ 先补 build 一份（闸门只看
      #   交易日不看相位，收盘后亦可生成）；intraday/post_market 当日已生成或本步上游刚生成。
      #   顺序即用户指定：盘前 → 盘中 → 盘后（周报仅周五生成，--latest weekly 自然跳过非周五）。
      #   continue-on-error：任一文件缺失/推送失败绝不拖红数据管线（失败不记指纹，下拍自愈）。
      - name: 补生成当日盘前报告（若缺失，供盘后汇总推）
        continue-on-error: true
        run: node scripts/build_ai_report.mjs --type pre_market
      - name: 推送盘前/盘中/盘后 AI 报告（企微 · 按 盘前→盘中→盘后 顺序 · 指纹防风暴）
        if: github.event.schedule == '0 13 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
        run: |
          TODAY=$(date +%F)
          # 盘前报告文件名取数据日（前一交易日，非生成日），由 index.json 解析，避免硬编码日期错位
          PM=$(node -e "try{const i=require('./data/reports/index.json');console.log(i.reports&&i.reports.pre_market&&i.reports.pre_market.file||'')}catch(e){console.log('')}")
          ARGS=""
          if [ -n "$PM" ] && [ -f "data/reports/$PM" ]; then ARGS="data/reports/$PM"; fi
          if [ -f "data/reports/intraday_${TODAY}.json" ]; then ARGS="$ARGS data/reports/intraday_${TODAY}.json"; fi
          if [ -f "data/reports/post_market_${TODAY}.json" ]; then ARGS="$ARGS data/reports/post_market_${TODAY}.json"; fi
          if [ -n "$ARGS" ]; then echo "[汇总推] 顺序 盘前→盘中→盘后，文件：$ARGS"; node scripts/push_ai_report.mjs $ARGS; fi
          node scripts/push_ai_report.mjs --latest weekly
      # ── 收盘口径复核（2026-10-10 用户指令：入库前再做一次收盘口径复核）──────────
      #   当日盘中推送档案（intraday_D.json）入库前，用 ztpool_history 收盘档复核：
      #   池标的收盘结局 / 推送时 vs 收盘情绪漂移 / 连板矛盾。台账写回档案顶层
      #   caliber_review → 随下方既有 git add data/reports 清单入库（提交规则零改动）。
      #   观测性质不拦数据面（continue-on-error）；18:30 若 ztpool 当日行未入库
      #   （本地 16:00 任务未提交）→ 脚本如实跳过，21:00 班补上（台账幂等覆盖）。
      #   ⚠ 与本地 16:00 入库任务（\ASentiment-dailyfetch-1600，docs/cron.md §6）
      #   零交集——本步只读已入库的 ztpool_history，不碰其触发/文件范围/git 规则。
      - name: 收盘口径复核（当日盘中推送档案，入库前）
        continue-on-error: true
        run: node scripts/review_intraday_caliber.mjs
      # Pages 部署产物上传已移除（2026-10-06 部署治理）：dist 部署通道收口至
      # deploy-pages.yml（双通道互相覆盖的实录与决策见该文件头注）。build_ui 保留——
      # dist/ 产物与 board_rank 写回仍是数据面的一部分；下面的数据提交（bot push）
      # 会经 deploy-pages.yml 的 paths(data/**) 自动触发页面刷新，闭环不变。
      # data/reports/ 一并提交（AI 报告档 + 推送指纹状态）：落 data/** 白名单内，
      # 页面首屏示例与最新报告随数据提交自动上线。
      # 影子账本推进（2026-10-11 加）：**只记账、不下单**——逐日推进"假设按 A 策略
      #   执行"的记录，用来**积累真实样本**。A 冰点反转是唯一跑赢基准的策略，但
      #   242 个交易日只触发 27 次、成交 17 笔，这个量级支撑不了自动下单（那等于把
      #   样本不足的策略放大执行）。跑几个月攒到 100+ 次触发，再谈接 QMT 实战。
      #   · 幂等：游标推进过的日期会跳过，重复跑不重算（故可安全放进每日管道）；
      #   · 研究性质（不产生真实订单、不写生产数据档）→ continue-on-error，
      #     它自己挂了不该阻断生产管道；但失败会留红叉在 run 里，不会静默过去。
      - name: 影子账本推进（只记账，不下单）
        continue-on-error: true
        run: node scripts/shadow_book.mjs

      - name: 提交最新数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/archive-index.json data/archive-recent.json data/archive-20*.json data/signals-latest.json data/backtest.json data/backtest-strategies.json data/global.json data/paper_universe.json data/paper_universe-lite.json data/calendar.json data/version-regression.json data/pain-latest.json data/breadth-latest.json data/breadth-daily.json data/crosscheck-latest.json data/ops-alerts-latest.json data/industry_outlier_review.json data/board_rank.json data/shadow-book.json data/paper data/reports ui/kline
          # git add data/llm-sentiment-latest.json 2>/dev/null || true  # 2026-10-17 暂停：LLM 试点停更，不再入库（代码保留归档）
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新情绪数据 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # bot push 竞态加固（2026-10-09 实录：手动 dispatch 全 job 并跑，us-close
            # 先推外围快照，build 数据提交后到被 non-fast-forward 拒——生产排期各 job
            # 时间带错开不相遇，手动验收必撞）。rebase 同分支远端新提交再推（main 副本
            # 运行时 $GITHUB_REF_NAME=main，不会误拉 staging）。-X theirs：rebase 中
            # theirs=本 run 刚生成的数据档——us-close 与 build 同轮各抓一份 global.json
            # 必冲突，生成型档以较新的本 run 产物为准（23:15 run 实录：裸 rebase 在
            # data/global.json 上 CONFLICT 卡死）。
            # push 重试（2026-10-13 run#194 实录：手动 dispatch 全 job 并跑，三 job 同秒推，
            # a50-close 先落 c80e9be0，其余两个带着 pull 时取到的旧 ref 预期（fbc84e7e）
            # 被「cannot lock ref」拒推——pull --rebase 只防"pull 前远端已动"，防不住
            # "pull 后 push 前"窗口。被拒后清理 rebase 状态→重拉重放→再推，最多 3 次。
            retry=0
            until git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push; do
              retry=$((retry+1))
              if [ "$retry" -ge 3 ]; then echo "push 连续 3 次被拒（并发竞态未解），放弃"; exit 1; fi
              echo "push 被拒（同轮 job 并发竞态），重试 $retry/3 ..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
      # 放在提交之后：数据已安全落库，再判定滞后。真滞后 → 本次运行标红（GitHub 会发失败通知），
      # 避免「回退/跳过被容错吞掉、job 仍是绿」这种静默故障再次发生。
      # 18:30 首抓常因龙虎榜未公布而跳过，此时判定为 pending（非滞后）不会误伤；21:00 补抓仍不成才会标红。
      - name: 数据新鲜度门禁（真滞后则本次运行失败）
        run: node scripts/freshness.mjs --require-fresh

  # deploy-pages job 已移除（2026-10-06 部署治理）：
  #   旧双通道 = 本 job（dist 合并版 UI 单文件）+ Settings 原生分支构建（main/root 仓库根），
  #   两者**互相覆盖**：2026-10-05 13:12 run 实录——本 job success 部署 dist → 同轮数据提交
  #   触发的原生分支构建完成于其后 → 云端被盖回分支内容；最终态取决于谁后完成（非确定）。
  #   现行单通道 = deploy-pages.yml（部署仓库根 web 面 = 当前云端页面形态，paths 白名单
  #   过滤文档类变更 + concurrency group "pages" 防覆盖，实录与设计见其文件头注）。
  #   本工作流回归纯数据生产：数据提交（bot push）→ deploy-pages.yml 自动触发部署。
  #   若未来启用合并版 UI（dist 单文件形态），在 deploy-pages.yml 换产物源即可——一处切换。

  intraday:
    # 盘中轻量快照：只抓 hot/pools/breadth 三个实时源（+腾讯行情量比/PE/PB、东财
    # 主力净流入），写 data/intraday.json。绝不触碰 archive.json —— 盘中涨跌家数
    # 未定盘，写进情绪因子会让分数反复跳变、分位失去意义。
    # 任务二拆分（2026-10-09）：tick 网格（:00/:30）回归**纯快照职责**——只抓
    # 数据不出报告；盘中 AI 报告只在三时点（北京 9:35/10:30/14:00 = '35 1'/
    # '30 2'/'0 6' UTC）各触发一次，先抓新快照再全量重算候选池（不沿用上轮）。
    # 10:30/14:00 与 tick 网格同刻会双 run（job 路由分流：tick-run 只快照，
    # 报告-run 快照+报告），concurrency 组内串行、先后无冲突。
    if: github.event.schedule == '0,30 1-7 * * 1-5' || github.event.schedule == '35 1 * * 1-5' || github.event.schedule == '30 2 * * 1-5' || github.event.schedule == '0 6 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 数据层迁移（2026-10-10）：盘中六源改走 python market_data.py intraday-raw
      # （QuantDash 主 + AkShare 兜底 + BaoStock 历史），旧直连源全部退役。
      #   key 缺席时 QuantDash 主路自动降级 AkShare（fail-safe，不红 job）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装新数据层依赖
        # ★ 2026-10-10 教训一：run 值必须整体加引号——未引号标量里的 ":all:"（尾冒号+空格）
        #   会被 YAML 解析器当 "mapping value" 语法，整个 workflow 触发器注册静默失败
        #   （workflow_dispatch 一直 422 的统一根因，PyYAML line351 col44 复现）。
        # ★ 教训二：不能用 --only-binary=:all:——akshare 依赖 jsonpath>=0.82 与
        #   baostock 均为 sdist-only（PyPI 无 wheel），CI 实测拒收。均为纯 Python
        #   包无编译风险，常规安装即可（与本地安装方式一致）。
        run: "pip install -r requirements-data.txt"
      # ── 数据层四项冒烟（2026-10-10 验收配套）：仅手动 workflow_dispatch 触发。
      #   周末/盘后随时手动跑一遍 CI 真网络全链验证：AkShare push2 族在 CI 预期
      #   可达（快照源应落 akshare-spot_em）；QuantDash universe 免费版 403 会记
      #   一条降级（预期内）。失败冒烟红 job——手动验证的语义就是可见。
      #   定时 cron 触发的生产班次不跑本步（零成本、零风险）。
      - name: 数据层四项冒烟（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        env:
          QUANTDASH_API_KEY: ${{ secrets.QUANTDASH_API_KEY }}
        run: python candidate_pool.py smoke
      # 脚本自带三重保险：① 相位非 live 直接跳过；② 强势股返回交易日 ≠ 北京当日则跳过
      # （该接口在非交易日会静默返回上一交易日数据）；③ 三源全失败则不覆盖上次成功快照。
      - name: 抓盘中快照（非盘中自动跳过）
        env:
          QUANTDASH_API_KEY: ${{ secrets.QUANTDASH_API_KEY }}
        run: node scripts/snapshot_intraday.mjs
      # ── 情绪数据跨源对账（2026-10-11）：为什么需要单独一步——涨停池的"多源降级"是假的，
      #   主源(东财 push2ex) 与"第一备源"(AkShare zt_pool) 请求**同一个 URL**，实为单点；
      #   能与主源互相证伪的只有自有快照自建池（ztDerived），涨跌家数另做跨口径比对（全A vs 沪深A）。
      #   只读盘中档（零新增请求）；限定三时点——tick 网格每半小时跑一次太密，对账一天三次足够。
      #   纯观测：脚本恒 exit 0 + continue-on-error 双保险，绝不拦后续步骤（观察者不是门禁）。
      - name: 情绪数据跨源对账（涨停池 + 涨跌家数）
        if: github.event.schedule == '35 1 * * 1-5' || github.event.schedule == '30 2 * * 1-5' || github.event.schedule == '0 6 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
        continue-on-error: true
        run: node scripts/ztpool_crosscheck.mjs --run-id "${{ github.run_id }}"
      # ── 数据源健康度台账（2026-10-11）：把每天每个源的状态累积成滚动台账（成功率/连续失败/
      #   最近成功）。补的是**事前可见性**——2026-08-14~09-03 那 14 天 EM 池整体失败，事前
      #   无任何信号，只能等它彻底挂掉才由别的审计发现。连续失败 ≥3 次才告警（1~2 次多抖动）。
      #   只读盘中档 + 写 data/source-health.json（随本 job 提交步骤入库）。恒 exit 0。
      - name: 数据源健康度台账
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
        continue-on-error: true
        run: node scripts/source_health.mjs
      # ── 任务二 · 盘中候选池（2026-10-09 拆分）：三时点各触发一次，全量重算。
      #   复用刚抓的当日快照（涨幅/量比/主力净流入/PE/PB），筛选口径见
      #   buildIntradayPool；快照缺席/陈旧 → 空池报因（不回落昨收口径——与任务一
      #   数据源物理隔离）。相位非 live 由 gateIntraday 自动跳过（exit 0）。
      #   指纹去重保留（防风暴纪律）：内容未变不重推。
      - name: 生成并推送盘中 AI 报告（任务二三时点，每轮重算）
        if: github.event.schedule == '35 1 * * 1-5' || github.event.schedule == '30 2 * * 1-5' || github.event.schedule == '0 6 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          OPS_WEBHOOK: ${{ secrets.OPS_WEBHOOK }}
        run: |
          node scripts/build_ai_report.mjs --type intraday
          node scripts/push_ai_report.mjs --latest intraday
      - name: 复盘"选不出票"归因（为次日开盘准备，2026-10-12 用户指令）
        # 频率闸门（2026-10-12 全系统审计 Fix 1）：仅在盘中 14:00 那档（北京 '0 6'）
        #   + 手动触发时跑。复盘为次日开盘准备、幂等覆盖，每日一次足矣；盘中每 30
        #   分钟 tick 下重跑纯属把同一份"昨日复盘"刷进群（已配 WECHAT 推送步骤同闸门）。
        if: github.event.schedule == '0 6 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/review_nopick.mjs
      # 复盘归因落地后推企微（2026-10-12 用户指令）：独立通道 WECHAT_WEBHOOK_URL。
      # continue-on-error：机器人未配/推送失败绝不拖红数据管线——复盘台账已落盘，
      #   推送只是触达，失败由 next tick 自愈（脚本未记去重态，重跑即重推）。
      - name: 推送复盘到企业微信（WECHAT_WEBHOOK_URL）
        # 与上游归因同闸门（2026-10-12 全系统审计 Fix 1）：仅 14:00 那档 + 手动触发，
        #   且须排在归因步骤之后；杜绝盘中每 30 分钟 tick 把同一份昨日复盘刷进群。
        if: github.event.schedule == '0 6 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: node scripts/push_review_wechat.mjs
      - name: 提交盘中快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intraday.json data/source-health.json data/crosscheck-history.json data/reports data/review
          if git diff --cached --quiet; then
            echo "无变化（非盘中或快照相同），跳过提交"
          else
            git commit -m "chore: 盘中快照+AI报告 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # bot push 竞态加固（2026-10-09 实录：手动 dispatch 全 job 并跑，us-close
            # 先推外围快照，build 数据提交后到被 non-fast-forward 拒——生产排期各 job
            # 时间带错开不相遇，手动验收必撞）。rebase 同分支远端新提交再推（main 副本
            # 运行时 $GITHUB_REF_NAME=main，不会误拉 staging）。-X theirs：rebase 中
            # theirs=本 run 刚生成的数据档——us-close 与 build 同轮各抓一份 global.json
            # 必冲突，生成型档以较新的本 run 产物为准（23:15 run 实录：裸 rebase 在
            # data/global.json 上 CONFLICT 卡死）。
            # push 重试（2026-10-13 run#194 实录：手动 dispatch 全 job 并跑，三 job 同秒推，
            # a50-close 先落 c80e9be0，其余两个带着 pull 时取到的旧 ref 预期（fbc84e7e）
            # 被「cannot lock ref」拒推——pull --rebase 只防"pull 前远端已动"，防不住
            # "pull 后 push 前"窗口。被拒后清理 rebase 状态→重拉重放→再推，最多 3 次。
            retry=0
            until git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push; do
              retry=$((retry+1))
              if [ "$retry" -ge 3 ]; then echo "push 连续 3 次被拒（并发竞态未解），放弃"; exit 1; fi
              echo "push 被拒（同轮 job 并发竞态），重试 $retry/3 ..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi

  premarket:
    # ── 任务一 · 盘前观察清单（2026-10-09 拆分）：北京 09:00 生成并推送 ──────
    #   cron '0 1 * * 1-5'（UTC 01:00）。为什么单独一个 job 而不是塞进 intraday：
    #   ① 数据源物理隔离——盘前只读**昨收口径**全档（dual_track/signals/global
    #   /pain 连板梯队），不依赖 intraday.json 实时源；② 相位 09:00 是 pre（非
    #   live），塞 intraday 会被它的相位闸门拦掉；③ 输出「今日观察清单」语义
