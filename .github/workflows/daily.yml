name: daily-sentiment

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 北京 18:30（UTC 10:30），仅周一至五；盘后首抓（部分源可能未出当日数据）
    - cron: '0 13 * * 1-5'    # 北京 21:00（UTC 13:00），晚间补抓：深证日K/龙虎榜等延迟数据齐后重抓当日并覆盖，合并时同日替换 + 全档重算
  workflow_dispatch:        # 手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 运行管道（live 模式，非交易日自动跳过）
        env:
          MODE: live
        run: node src/pipeline.js
      - name: 生成 V5.2 回测档（成本/平滑/风控/网格帕累托/滚动/主线选股）
        run: node scripts/backtest.mjs
      - name: 单元测试（含 Python↔JS 一致性夹具比对）
        run: node --test
      - name: 提交最新数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/backtest.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新情绪数据 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
