    # ★ 美股收盘档（2026-10-01 事故修复）：只抓外围，不跑管道。
    #   为什么单独成一个 job 而不是并进 build：
    #     · 触发时刻是北京次日 04:30，与 build 的 18:30/21:00 完全不同；
