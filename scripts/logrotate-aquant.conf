# logrotate 配置：a-sentiment-pro 树莓派运维日志（SSD 写入卫生）
#
# 安装（一次性，需 sudo）：
#   sudo cp scripts/logrotate-aquant.conf /etc/logrotate.d/aquant
#   sudo logrotate --debug /etc/logrotate.d/aquant     # 语法与路径校验（干跑，不实际轮转）
#
# 设计取舍：
#   · copytruncate —— 写日志的是 shell 脚本（pi_run.sh / pi_push.sh 的 log() 每次
#     「开-追加-关」），虽不长期持有 fd，用 copytruncate 可彻底规避「进程仍持旧 inode」
#     的风险；代价是轮转瞬间可能丢极少几行，对运维日志可接受。
#   · maxsize 20M + daily —— 双触发：单日暴涨超 20M 立即轮转，否则每日一滚。
#   · rotate 14 / compress / delaycompress —— 保留 2 周历史，压缩且延迟一周期
#     （避免压缩「正在被追加的档」）。
#   · dateext —— 轮转档带日期后缀，便于人工定位「10-24 晚 EOD 为什么失败」。
/var/log/aquant/*.log {
    daily
    rotate 14
    maxsize 20M
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
    create 0664 sjc19950404 sjc19950404
}
